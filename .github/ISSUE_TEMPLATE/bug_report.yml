name: Bug report
description: Report a reproducible problem without including private data.
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, OAuth secrets, SMTP passwords, resumes, email addresses, or private logs.
        Security vulnerabilities belong in the private channel described in SECURITY.md.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit or version
      placeholder: e.g. 8b017cd or 0.1.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Include safe, minimal steps that do not expose personal data.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: OS, Node.js version, browser, and whether this is local or deployed
    validations:
      required: true
